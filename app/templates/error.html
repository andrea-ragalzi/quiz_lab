{% extends "base.html" %}
{% block title %}{{ code }} — QuizLab{% endblock %}
{% block content %}
  <div class="container">
    <section class="card error-page" aria-labelledby="error-title">
      <svg viewBox="0 0 120 96" aria-hidden="true" focusable="false">
        <path d="M58 94V26" stroke="#1f3328" stroke-width="6" stroke-linecap="round" />
        <path d="M58 18h44l12 12-12 12H58z" fill="#c84a2a" />
        <path d="M58 48H18L6 60l12 12h40z" fill="#3f6b4b" />
        <circle cx="96" cy="84" r="8" fill="#f2b33d" />
      </svg>
      <h1 id="error-title">{{ 'Pagina non trovata' if code == 404 else title|italian }}</h1>
      <p>{{ message|italian }}</p>
      <p class="field-help">Codice errore: {{ code }}</p>
      <a class="btn btn-primary" href="{{ url_for('main.home') }}">Torna alla pagina iniziale</a>
    </section>
  </div>
{% endblock %}
